name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inisialisasi Project Web ke Android (Capacitor)
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "Kas Luhurian" "com.luhurian.kas" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Pasang Logo Utuh (Tanpa Terpotong Adaptive Icon)
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - << 'PY'
          import re, base64, glob
          html = open("index.html", "r", encoding="utf-8").read()
          m = re.search(r'id="app-logo"[^>]*src="data:image/[^;]+;base64,([^"]+)"', html)
          if m:
              img_bytes = base64.b64decode(m.group(1))
              for p in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
                  open(p, "wb").write(img_bytes)
              print("Berhasil memasang logo utuh ke seluruh mipmap APK")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kas-Luhurian-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
